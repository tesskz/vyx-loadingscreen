<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>VYX</title>
<style>
  /* Fond gris clair (= couleur de l'image) : évite tout flash noir avant chargement. */
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e6e8ea}
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
  <!-- Image fixe plein écran (remplace l'ancienne vidéo : plus aucun risque d'écran noir). -->
  <img id="bg" src="assets/photo.jpg" alt="">

  <!-- Son en boucle. -->
  <audio id="snd" loop autoplay preload="auto">
    <source src="assets/son.mp3" type="audio/mpeg">
  </audio>

  <script>
    // L'attribut "autoplay" seul ne suffit pas toujours dans le navigateur GMod :
    // on force la lecture du son avec ré-essais. Volume à 3 %.
    var VOL = 0.03;
    var a = document.getElementById('snd');
    if (a) a.volume = VOL;

    function go(){
      if (!a) return;
      a.volume = VOL;              // re-appliqué : certains navigateurs le réinitialisent
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    }

    go();
    if (a){ a.addEventListener('canplay', go); a.addEventListener('loadeddata', go); }
    document.addEventListener('DOMContentLoaded', go);
    window.addEventListener('load', go);

    // ré-essais pendant ~10 s (au cas où le son n'est pas encore chargé)
    var tries = 0;
    var iv = setInterval(function(){
      go();
      if (++tries > 25 || (a && !a.paused && a.currentTime > 0)) clearInterval(iv);
    }, 400);

    // filet ultime : démarre à la moindre interaction
    ['click','keydown','mousemove','touchstart'].forEach(function(e){
      document.addEventListener(e, go);
    });
  </script>
</body>
</html>
