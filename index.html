<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>VYX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
<style>
  /* L'image plein écran, telle quelle (jamais déformée, rien de dessiné dessus) ; une fine interface
     posée en bas, sur la ville sombre : pourcentage, étape, serveur, la jauge et l'araignée de la Brigade. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { color: #fff; font-family: "Bree Serif", Georgia, serif; }
  #bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }

  #ui { position: fixed; left: 4.4vh; right: 4.4vh; bottom: 4.6vh; height: 9vh; text-shadow: 0 0.1vh 0.3vh rgba(0, 0, 0, 0.55); }

  #pct {
    position: absolute; left: 0; bottom: 3.3vh;
    font-family: "Bree Serif", Georgia, serif; font-size: 5.6vh; line-height: 0.82; font-variant-numeric: tabular-nums;
  }
  #pct small { font-size: 2.2vh; margin-left: 0.25vh; vertical-align: top; }
  #etat { position: absolute; left: 14vh; bottom: 3.5vh; right: 42%; white-space: nowrap; }
  #phase { font-family: "Bree Serif", Georgia, serif; font-size: 2.1vh; letter-spacing: 0.14em; text-transform: uppercase; }
  #detail { font-size: 1.3vh; margin-top: 0.45vh; overflow: hidden; text-overflow: ellipsis; opacity: 0.6; }
  #infos { position: absolute; right: 0; bottom: 3.5vh; text-align: right; font-size: 1.3vh; line-height: 1.6; }
  #infos b { display: block; font-family: "Bree Serif", Georgia, serif; font-weight: normal; font-size: 2.1vh;
             letter-spacing: 0.1em; line-height: 1.1; text-transform: uppercase; }
  #infos span { opacity: 0.6; }

  /* la jauge : un trait fin */
  #jauge { position: absolute; left: 0; right: 0; bottom: 0; height: 0.42vh; background: rgba(255, 255, 255, 0.2); }
  #plein { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; }

  /* l'araignée : à cheval sur le trait, la tête au bout de la partie remplie */
  #araignee { position: absolute; left: 0; bottom: -3.49vh; width: 7.4vh; height: 7.4vh; margin-left: -5.3vh; }
  #araignee svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
  <img id="bg" src="assets/photo.png" alt="">

  <div id="ui">
    <div id="pct">0<small>%</small></div>
    <div id="etat">
      <div id="phase">Connexion</div>
      <div id="detail">en attente du serveur…</div>
    </div>
    <div id="infos">
      <b id="nom">VYX</b>
      <span id="carte">Hunter x Hunter RP</span>
    </div>
    <div id="jauge"><div id="plein"></div></div>
    <div id="araignee">
      <svg viewBox="-24 -24 48 48" aria-hidden="true">
        <g id="pattes" fill="#fff" stroke="#0b0b0b" stroke-width="0.7" stroke-linejoin="round"></g>
        <g fill="#fff" stroke="#0b0b0b" stroke-width="0.8">
          <path d="M -0.5 0 C -2 -6.6, -11 -7.6, -15 -3.4 C -17.2 -1.2, -17.2 1.2, -15 3.4 C -11 7.6, -2 6.6, -0.5 0 Z"/>
          <ellipse cx="4.6" cy="0" rx="4.7" ry="3.5"/>
          <ellipse cx="9.6" cy="0" rx="2.3" ry="2"/>
          <path d="M 11.2 -1.6 Q 13.6 -2.2 13.4 -0.4 Q 12.4 -0.9 11.4 -0.6 Z M 11.2 1.6 Q 13.6 2.2 13.4 0.4 Q 12.4 0.9 11.4 0.6 Z"/>
        </g>
        <text x="-8.4" y="3.3" text-anchor="middle" font-family="Bree Serif, Georgia, serif" font-size="9" fill="#0b0b0b">0</text>
      </svg>
    </div>
  </div>

  <!-- Son en boucle. -->
  <audio id="snd" loop autoplay preload="auto">
    <source src="assets/son.mp3" type="audio/mpeg">
  </audio>

  <script>
  (function () {
    // ------------------------------------------------------------------ le son (inchangé : 3 %, ré-essais)
    var VOL = 0.03;
    var a = document.getElementById('snd');
    if (a) a.volume = VOL;
    function go() {
      if (!a) return;
      a.volume = VOL;
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    }
    go();
    if (a) { a.addEventListener('canplay', go); a.addEventListener('loadeddata', go); }
    document.addEventListener('DOMContentLoaded', go);
    window.addEventListener('load', go);
    var tries = 0;
    var iv = setInterval(function () {
      go();
      if (++tries > 25 || (a && !a.paused && a.currentTime > 0)) clearInterval(iv);
    }, 400);
    ['click', 'keydown', 'mousemove', 'touchstart'].forEach(function (e) { document.addEventListener(e, go); });

    // ------------------------------------------------------------------ éléments
    function $(id) { return document.getElementById(id); }
    var elPct = $('pct'), elPhase = $('phase'), elDetail = $('detail'), elPlein = $('plein');
    var elAraignee = $('araignee'), elPattes = $('pattes');

    // ------------------------------------------------------------------ l'avancement
    // GMod ne donne un compte de fichiers que pour le téléchargement direct ; le reste (Workshop, montage,
    // Lua) n'arrive que par des messages d'état. Chaque étape pose un plancher et un plafond : la jauge
    // avance d'elle-même vers le plafond (jamais figée), sans le dépasser avant l'étape suivante.
    var S = { floor: 0.02, cap: 0.08, total: 0, needed: 0, creep: 0.02, shown: 0 };
    function etape(floor, cap) {
      if (floor > S.floor) S.floor = floor;
      if (cap > S.cap) S.cap = cap;
    }
    function texte(el, t) { if (el.textContent !== t) el.textContent = t; }

    var ETATS = [
      [/retriev|parsing|server info/i, 'Connexion', 0.04, 0.12],
      [/workshop|downloading|t[ée]l[ée]charg/i, 'Téléchargement', 0.12, 0.6],
      [/mount|montage/i, 'Montage des addons', 0.62, 0.7],
      [/sending client info/i, 'Envoi des infos', 0.72, 0.8],
      [/client info sent/i, 'Infos envoyées', 0.8, 0.86],
      [/lua files|received all/i, 'Fichiers Lua reçus', 0.86, 0.92],
      [/starting lua|lua started/i, 'Démarrage du Lua', 0.92, 0.98]
    ];

    window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
      if (servername) texte($('nom'), servername);
      var bits = [];
      if (mapname) bits.push(mapname);
      if (gamemode) bits.push(gamemode);
      if (maxplayers) bits.push(maxplayers + ' places');
      if (bits.length) texte($('carte'), bits.join('  ·  '));
      etape(0.04, 0.12);
    };
    window.SetFilesTotal = function (n) { S.total = Math.max(0, +n || 0); };
    window.SetFilesNeeded = function (n) { S.needed = Math.max(0, +n || 0); };
    window.DownloadingFile = function (f) {
      texte(elPhase, 'Téléchargement');
      texte(elDetail, String(f || '').replace(/^.*[\\\/]/, '') + (S.total ? '   ' + (S.total - S.needed) + ' / ' + S.total : ''));
      etape(0.12, 0.6);
    };
    window.SetStatusChanged = function (s) {
      s = String(s || '');
      for (var i = 0; i < ETATS.length; i++) {
        var e = ETATS[i];
        if (e[0].test(s)) {
          texte(elPhase, e[1]);
          etape(e[2], e[3]);
          // « Downloading 3/40 » (Workshop) : la part de l'étape qui est faite
          var m = s.match(/(\d+)\s*\/\s*(\d+)/);
          if (e[1] === 'Téléchargement' && m && +m[2] > 0) {
            var f = Math.min(1, +m[1] / +m[2]);
            etape(0.12 + 0.48 * f, Math.min(0.6, 0.12 + 0.48 * (f + 1 / +m[2])));
          }
          break;
        }
      }
      texte(elDetail, s);
    };

    // ------------------------------------------------------------------ l'araignée : 12 pattes effilées
    // Vue du dessus, la tête vers la droite (le sens de la jauge). Chaque patte : une cuisse épaisse jusqu'au
    // genou, puis un tibia qui s'affine en pointe ; les avant visent l'avant, les arrière l'arrière.
    var SVGNS = 'http://www.w3.org/2000/svg';
    var PATTES = [];
    var RACINE = [7.5, 6.3, 5.0, 3.8, 2.6, 1.4];
    var GENOU  = [[14, 8.5], [11, 12], [6.5, 13.8], [0, 13.8], [-5, 12], [-8.5, 8.5]];
    var PIED   = [[24, 12.5], [19.5, 19], [9.5, 22.5], [-4, 22.5], [-14, 19], [-21.5, 12.5]];
    for (var k = 0; k < 6; k++) {
      for (var side = -1; side <= 1; side += 2) {
        var el = document.createElementNS(SVGNS, 'path');
        elPattes.appendChild(el);
        PATTES.push({ el: el, x0: RACINE[k], kx: GENOU[k], fx: PIED[k], side: side, k: k, phase: (k + (side > 0 ? 1 : 0)) % 2 });
      }
    }
    function nrm(ax, ay, bx, by) { var dx = bx - ax, dy = by - ay, l = Math.sqrt(dx * dx + dy * dy) || 1; return [-dy / l, dx / l]; }
    function f1(v) { return v.toFixed(2); }
    var marche = 0;
    function dessinePattes(bouge) {
      for (var i = 0; i < PATTES.length; i++) {
        var P = PATTES[i];
        var t = marche + P.phase * Math.PI;
        var sw = bouge ? Math.sin(t) * 2.4 : 0;
        var lift = bouge ? Math.max(0, Math.cos(t)) * 1.2 : 0;
        var rx = P.x0, ry = P.side * 2.4;
        var kx = P.kx[0] + sw * 0.45, ky = P.side * (P.kx[1] - lift * 0.4);
        var fx = P.fx[0] + sw, fy = P.side * (P.fx[1] - lift);
        var n0 = nrm(rx, ry, kx, ky), n1 = nrm(kx, ky, fx, fy);
        var nk = [(n0[0] + n1[0]) / 2, (n0[1] + n1[1]) / 2];
        var w0 = 1.35, wk = 1.0;
        // le tibia se courbe un peu vers l'extérieur : point de contrôle décalé
        var mx = (kx + fx) / 2 + n1[0] * P.side * -0.9, my = (ky + fy) / 2 + n1[1] * P.side * -0.9;
        var d = 'M' + f1(rx + n0[0] * w0) + ' ' + f1(ry + n0[1] * w0)
              + 'L' + f1(kx + nk[0] * wk) + ' ' + f1(ky + nk[1] * wk)
              + 'Q' + f1(mx + n1[0] * 0.45) + ' ' + f1(my + n1[1] * 0.45) + ' ' + f1(fx) + ' ' + f1(fy)
              + 'Q' + f1(mx - n1[0] * 0.45) + ' ' + f1(my - n1[1] * 0.45) + ' ' + f1(kx - nk[0] * wk) + ' ' + f1(ky - nk[1] * wk)
              + 'L' + f1(rx - n0[0] * w0) + ' ' + f1(ry - n0[1] * w0) + 'Z';
        P.el.setAttribute('d', d);
      }
    }

    // ------------------------------------------------------------------ boucle
    var last = Date.now();
    var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    function tick() {
      var now = Date.now(), dt = Math.min(0.1, (now - last) / 1000);
      last = now;

      var files = 0;
      if (S.total > 0) files = 0.12 + 0.48 * Math.min(1, (S.total - S.needed) / S.total);
      var target = Math.max(S.floor, files);
      // la jauge glisse d'elle-même vers le plafond de l'étape (de plus en plus lentement)
      S.creep = Math.max(S.creep, target);
      S.creep += (S.cap - S.creep) * Math.min(1, dt * 0.18);
      var goal = Math.min(1, Math.max(target, S.creep));
      var avant = S.shown;
      S.shown += (goal - S.shown) * Math.min(1, dt * 5);
      if (goal - S.shown < 0.0005) S.shown = goal;

      var p = S.shown * 100;
      elPlein.style.width = p.toFixed(2) + '%';
      elAraignee.style.left = p.toFixed(2) + '%';
      var n = Math.floor(p);
      if (elPct.firstChild.nodeValue !== String(n)) elPct.firstChild.nodeValue = String(n);

      // elle marche quand la jauge avance, au pas de sa vitesse ; immobile sinon
      var vitesse = (S.shown - avant) / Math.max(dt, 0.001);
      var bouge = vitesse > 0.002;
      if (bouge) marche += dt * Math.min(16, 6 + vitesse * 160);
      dessinePattes(bouge);
      raf(tick);
    }
    dessinePattes(false);
    tick();

    // ------------------------------------------------------------------ démo hors jeu : index.html?demo
    if (/[?&]demo/.test(location.search)) {
      var t0 = Date.now(), total = 180;
      GameDetails('VYX — Hunter x Hunter RP', '', 'rp_yorknew_city', 64, '', 'mangarp');
      SetStatusChanged('Retrieving server info...');
      var demo = setInterval(function () {
        var s = (Date.now() - t0) / 1000;
        if (s > 1.5 && s < 9) {
          SetFilesTotal(total);
          var left = Math.max(0, Math.round(total * (1 - (s - 1.5) / 7.5)));
          SetFilesNeeded(left);
          DownloadingFile('materials/vyx/hud/hud_bar_v' + (left % 7 + 1) + '.png');
        } else if (s >= 9 && s < 11) SetStatusChanged('Mounting Addons');
        else if (s >= 11 && s < 12.5) SetStatusChanged('Sending client info...');
        else if (s >= 12.5 && s < 14) SetStatusChanged('Received all Lua files');
        else if (s >= 14 && s < 16) SetStatusChanged('Starting Lua...');
        else if (s >= 22) { clearInterval(demo); }
      }, 250);
    }
  })();
  </script>
</body>
</html>
