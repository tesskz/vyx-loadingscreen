<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyzen</title>
<style>
  /* KYZEN — l'écran de chargement, dans la D.A. « encre et givre » du serveur : cadres à coins coupés au double
     filet argenté et losanges aux coins, pilules hexagonales, rangée d'étoiles ; marine, argent, lavande.
     Aplats seulement (pas de dégradé, pas de lueur). */
  @font-face { font-family: "Lexend"; src: url("assets/fonts/kyzen_lexend.ttf") format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "Hind"; src: url("assets/fonts/kyzen_hind_semibold.ttf") format("truetype"); font-weight: 600; }

  :root {
    --fond: rgba(22, 24, 31, 0.86);
    --fond2: rgb(34, 37, 50);
    --ligne: rgb(214, 217, 234);
    --ligne2: rgba(214, 217, 234, 0.37);
    --pilule: rgb(61, 66, 99);
    --pilule2: rgb(93, 99, 146);
    --lav: rgb(179, 184, 232);
    --lavS: rgb(143, 149, 207);
    --texte: rgb(238, 240, 248);
    --dim: rgb(163, 167, 189);
    --sombre: rgb(27, 29, 44);
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0e14; }
  body { color: var(--texte); font-family: "Hind", "Segoe UI", sans-serif; font-weight: 600; }

  /* le fond : l'illustration, qui respire très lentement */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%;
        animation: souffle 34s ease-in-out infinite alternate; }
  @keyframes souffle { from { transform: scale(1); } to { transform: scale(1.06); } }
  #voile { position: fixed; inset: 0; background: rgba(13, 14, 20, 0.12); }
  #poussiere { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* un cadre : son dessin (SVG, recalculé à chaque taille) derrière son contenu */
  .cadre { position: absolute; }
  .cadre > svg.dessin { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

  /* ---------------------------------------------------------------- la plaque du bas */
  #plaque { left: 4.4vh; right: 4.4vh; bottom: 3.8vh; height: 14.6vh;
            animation: monte 0.9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes monte { from { opacity: 0; transform: translateY(2.4vh); } to { opacity: 1; transform: none; } }

  #etoiles { position: absolute; left: 50%; top: 0; width: 30vh; height: 6vh; margin: -3vh 0 0 -15vh; overflow: visible; }
  #etoiles .e { transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  #pct { position: absolute; left: 4.2vh; top: 2.1vh; font-family: "Lexend", sans-serif; font-weight: 600;
         font-size: 7.4vh; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #pct small { font-size: 2.6vh; font-weight: 500; margin-left: 0.3vh; vertical-align: 3.9vh; color: var(--lav); }

  #etat { position: absolute; left: 21vh; top: 3vh; right: 48%; }
  #phase { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 2.3vh; letter-spacing: 0.16em; text-transform: uppercase; }
  #detail { font-size: 1.45vh; color: var(--dim); margin-top: 0.7vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #infos { position: absolute; right: 4.2vh; top: 3vh; text-align: right; max-width: 44%; }
  #nom { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 2.3vh; letter-spacing: 0.08em; text-transform: uppercase;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #carte { font-size: 1.45vh; color: var(--dim); margin-top: 0.7vh; white-space: nowrap; }

  /* la jauge : un filet, des losanges tous les 10 %, l'étoile au bout */
  #jauge { position: absolute; left: 5.4vh; right: 5.4vh; bottom: 2.4vh; height: 3vh; }
  #rail { position: absolute; left: 0; right: 0; top: 50%; height: 0.24vh; margin-top: -0.12vh; background: var(--ligne2); }
  #plein { position: absolute; left: 0; top: 50%; height: 0.56vh; margin-top: -0.28vh; width: 0; background: var(--lav); }
  .cran { position: absolute; top: 50%; width: 0.9vh; height: 0.9vh; margin: -0.45vh 0 0 -0.45vh; transform: rotate(45deg);
          background: var(--sombre); box-shadow: 0 0 0 0.16vh var(--ligne2); }
  .cran.on { background: var(--texte); box-shadow: 0 0 0 0.16vh var(--texte); }
  .bout { position: absolute; top: 50%; width: 1.3vh; height: 1.3vh; margin: -0.65vh 0 0 -0.65vh; transform: rotate(45deg); background: #fff; }
  #pointe { position: absolute; top: 50%; left: 0; width: 4.4vh; height: 4.4vh; margin: -2.2vh 0 0 -2.2vh; }
  #pointe svg { width: 100%; height: 100%; overflow: visible; }

  /* ---------------------------------------------------------------- l'astuce */
  #astuce { right: 4.4vh; bottom: 22vh; width: 50vh; height: 10.6vh;
            animation: monte 0.9s .25s cubic-bezier(.2, .8, .2, 1) both; }
  #astuce .pil { position: absolute; left: 2.4vh; top: -1.5vh; }
  #astuceTxt { position: absolute; left: 3vh; right: 3vh; top: 2.6vh; font-size: 1.75vh; line-height: 1.45;
               transition: opacity .45s, transform .45s; }
  #astuceTxt.sort { opacity: 0; transform: translateY(0.6vh); }
  #astuceTxt b { font-family: "Lexend", sans-serif; font-weight: 600; color: var(--lav); }

  /* ---------------------------------------------------------------- les pilules (hexagonales) */
  .pil { position: absolute; height: 3.2vh; padding: 0 4vh; display: flex; align-items: center; justify-content: center;
         font-family: "Lexend", sans-serif; font-weight: 600; font-size: 1.45vh; letter-spacing: 0.14em; text-transform: uppercase;
         color: var(--texte); --p: 1.6vh;
         clip-path: polygon(var(--p) 0, calc(100% - var(--p)) 0, 100% 50%, calc(100% - var(--p)) 100%, var(--p) 100%, 0 50%);
         background: var(--ligne); }
  .pil::before { content: ""; position: absolute; inset: 0.16vh; z-index: -1; background: var(--pilule);
                 clip-path: polygon(var(--p) 0, calc(100% - var(--p)) 0, 100% 50%, calc(100% - var(--p)) 100%, var(--p) 100%, 0 50%); }
  .pil { isolation: isolate; }
  .pil .lo { position: absolute; top: 50%; width: 0.62vh; height: 0.62vh; margin-top: -0.31vh; transform: rotate(45deg); background: currentColor; }
  .pil .lo.g { left: 1.9vh; } .pil .lo.d { right: 1.9vh; }
  .pil.lav { color: var(--sombre); }
  .pil.lav::before { background: var(--lav); }

  #son { position: fixed; right: 4.4vh; top: 3.8vh; cursor: pointer; user-select: none; min-width: 13vh;
         animation: monte 0.9s .4s cubic-bezier(.2, .8, .2, 1) both; }
  #son:hover::before { background: var(--pilule2); }
  #son.off { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) {
    #bg, #plaque, #astuce, #son, #etoiles .e { animation: none; }
  }
</style>
</head>
<body>
  <img id="bg" src="assets/kyzen.jpg" alt="">
  <div id="voile"></div>
  <canvas id="poussiere"></canvas>

  <div class="pil" id="son" title="Couper ou remettre la musique"><span class="lo g"></span><span id="sonTxt">Musique</span><span class="lo d"></span></div>

  <div class="cadre" id="astuce" data-cut="1.4">
    <svg class="dessin"></svg>
    <div class="pil lav"><span class="lo g"></span>Astuce<span class="lo d"></span></div>
    <div id="astuceTxt"></div>
  </div>

  <div class="cadre" id="plaque" data-cut="2.4" data-entete="0">
    <svg class="dessin"></svg>
    <svg id="etoiles" viewBox="-150 -30 300 60" aria-hidden="true"></svg>
    <div id="pct">0<small>%</small></div>
    <div id="etat">
      <div id="phase">Connexion</div>
      <div id="detail">en attente du serveur…</div>
    </div>
    <div id="infos">
      <div id="nom">Kyzen</div>
      <div id="carte">Chainsaw Man RP</div>
    </div>
    <div id="jauge">
      <div id="rail"></div>
      <div id="plein"></div>
      <div class="bout" style="left:0"></div>
      <div class="bout" style="left:100%"></div>
      <div id="pointe"><svg viewBox="-24 -24 48 48" aria-hidden="true"><path id="etoile" fill="#fff"/></svg></div>
    </div>
  </div>

  <!-- la musique, en boucle -->
  <audio id="snd" loop autoplay preload="auto">
    <source src="assets/kyzen.mp3" type="audio/mpeg">
  </audio>

  <script>
  (function () {
    function $(id) { return document.getElementById(id); }
    var NS = 'http://www.w3.org/2000/svg';

    // ------------------------------------------------------------------ la musique (3 %, ré-essais, bouton)
    var VOL = 0.03;
    var a = $('snd');
    var coupe = false;
    try { coupe = localStorage.getItem('kyzen_ls_muet') === '1'; } catch (e) {}
    function go() {
      if (!a || coupe) return;
      a.volume = VOL;
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    }
    function majSon() {
      $('son').classList.toggle('off', coupe);
      $('sonTxt').textContent = coupe ? 'Musique coupée' : 'Musique';
    }
    $('son').addEventListener('click', function (ev) {
      ev.stopPropagation();
      coupe = !coupe;
      try { localStorage.setItem('kyzen_ls_muet', coupe ? '1' : '0'); } catch (e) {}
      if (coupe) a.pause(); else go();
      majSon();
    });
    majSon();
    go();
    if (a) { a.addEventListener('canplay', go); a.addEventListener('loadeddata', go); }
    window.addEventListener('load', go);
    var tries = 0;
    var iv = setInterval(function () {
      go();
      if (++tries > 25 || (a && !a.paused && a.currentTime > 0)) clearInterval(iv);
    }, 400);
    ['click', 'keydown', 'mousemove'].forEach(function (e) { document.addEventListener(e, go); });

    // ------------------------------------------------------------------ les formes de la D.A.
    function losange(x, y, s) { return 'M' + x + ' ' + (y - s) + 'L' + (x + s) + ' ' + y + 'L' + x + ' ' + (y + s) + 'L' + (x - s) + ' ' + y + 'Z'; }
    function oct(x, y, w, h, c) {
      return 'M' + (x + c) + ' ' + y + 'L' + (x + w - c) + ' ' + y + 'L' + (x + w) + ' ' + (y + c) + 'L' + (x + w) + ' ' + (y + h - c)
        + 'L' + (x + w - c) + ' ' + (y + h) + 'L' + (x + c) + ' ' + (y + h) + 'L' + x + ' ' + (y + h - c) + 'L' + x + ' ' + (y + c) + 'Z';
    }
    function etoile4(r, ri) {
      var d = '';
      for (var i = 0; i < 8; i++) {
        var t = Math.PI / 4 * i - Math.PI / 2, q = i % 2 ? ri : r;
        d += (i ? 'L' : 'M') + (Math.cos(t) * q).toFixed(2) + ' ' + (Math.sin(t) * q).toFixed(2);
      }
      return d + 'Z';
    }
    function el(tag, attrs, parent) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(n);
      return n;
    }

    // un cadre : fond marine, filet argenté, filet intérieur, un losange blanc à chaque coin
    function dessinerCadre(c) {
      var vh = window.innerHeight / 100;
      var w = c.clientWidth, h = c.clientHeight;
      var cut = parseFloat(c.getAttribute('data-cut')) * vh;
      var svg = c.querySelector('svg.dessin');
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      svg.innerHTML = '';
      var e = Math.max(1.5, 0.19 * vh), i = 0.65 * vh;
      el('path', { d: oct(0, 0, w, h, cut), fill: 'rgba(22,24,31,0.93)' }, svg);
      el('path', { d: oct(e / 2, e / 2, w - e, h - e, cut), fill: 'none', stroke: 'rgb(214,217,234)', 'stroke-width': e, 'stroke-linejoin': 'miter' }, svg);
      el('path', { d: oct(i, i, w - i * 2, h - i * 2, Math.max(2, cut - 0.3 * vh)), fill: 'none', stroke: 'rgba(214,217,234,0.37)', 'stroke-width': 1 }, svg);
      var d = 0.5 * vh;
      [[cut / 2, cut / 2], [w - cut / 2, cut / 2], [cut / 2, h - cut / 2], [w - cut / 2, h - cut / 2]].forEach(function (q) {
        el('path', { d: losange(q[0], q[1], d), fill: '#fff' }, svg);
      });
    }
    function dessinerTout() {
      var cs = document.querySelectorAll('.cadre');
      for (var k = 0; k < cs.length; k++) dessinerCadre(cs[k]);
    }
    window.addEventListener('resize', dessinerTout);
    dessinerTout();

    // la rangée d'étoiles, à cheval sur le haut de la plaque (le centre : l'étoile à quatre branches)
    (function () {
      var svg = $('etoiles');
      var n = 7, mid = 3, pas = 40;
      for (var k = 0; k < n; k++) {
        var x = (k - mid) * pas, dd = Math.abs(k - mid);
        var p = dd === 0 ? el('path', { d: etoile4(26, 6.5), transform: 'translate(' + x + ' 0) rotate(20)' }, svg)
                         : el('path', { d: losange(x, 0, dd >= mid ? 4.5 : 8.5) }, svg);
        p.setAttribute('fill', '#fff');
        p.setAttribute('class', 'e');
        p.style.animationDelay = (0.5 + dd * 0.09) + 's';
      }
    })();
    $('etoile').setAttribute('d', etoile4(20, 5));

    // les crans de la jauge, tous les 10 %
    var CRANS = [];
    for (var k = 1; k <= 9; k++) {
      var c = document.createElement('div');
      c.className = 'cran';
      c.style.left = (k * 10) + '%';
      $('jauge').insertBefore(c, $('pointe'));
      CRANS.push(c);
    }

    // ------------------------------------------------------------------ les astuces
    var ASTUCES = [
      'Maintiens <b>C</b> : le menu des pouvoirs, l\'arbre des compétences et l\'inventaire.',
      'La touche <b>I</b> ouvre ton inventaire : c\'est là que tu équipes ton arme.',
      'Chaque grade te donne des <b>points de capacité</b> à dépenser dans l\'arbre des compétences.',
      '<b>Échap</b> ouvre le hub : la boutique, les paramètres et tes personnages.',
      'Les <b>démons</b> se battent à mains nues ; les <b>chasseurs</b> peuvent manier l\'épée.',
      '<b>TAB</b> affiche les joueurs connectés : clique sur un nom pour couper son micro.',
      'Tes objets sont <b>imperdables</b> : ni la mort ni la déconnexion ne te les retirent.'
    ];
    var ia = Math.floor(Math.random() * ASTUCES.length);
    var elA = $('astuceTxt');
    elA.innerHTML = ASTUCES[ia];
    setInterval(function () {
      elA.classList.add('sort');
      setTimeout(function () {
        ia = (ia + 1) % ASTUCES.length;
        elA.innerHTML = ASTUCES[ia];
        elA.classList.remove('sort');
      }, 450);
    }, 7000);

    // ------------------------------------------------------------------ la poussière de givre (petits losanges)
    var cv = $('poussiere'), cx = cv.getContext('2d');
    var GRAINS = [];
    function taille() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
    taille();
    window.addEventListener('resize', taille);
    for (var g = 0; g < 34; g++) {
      GRAINS.push({ x: Math.random(), y: Math.random(), s: 0.18 + Math.random() * 0.4, v: 0.008 + Math.random() * 0.02,
                    a: 0.12 + Math.random() * 0.35, ph: Math.random() * 6.28 });
    }
    var calme = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function poussiere(dt, t) {
      var W = cv.width, H = cv.height, vh = H / 100;
      cx.clearRect(0, 0, W, H);
      for (var k = 0; k < GRAINS.length; k++) {
        var p = GRAINS[k];
        if (!calme) { p.y -= p.v * dt; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); } }
        var x = (p.x + Math.sin(t * 0.4 + p.ph) * 0.006) * W, y = p.y * H, s = p.s * vh;
        cx.fillStyle = 'rgba(214,217,234,' + p.a + ')';
        cx.beginPath();
        cx.moveTo(x, y - s); cx.lineTo(x + s, y); cx.lineTo(x, y + s); cx.lineTo(x - s, y);
        cx.closePath(); cx.fill();
      }
    }

    // ------------------------------------------------------------------ l'avancement (API de chargement GMod)
    // GMod ne donne un compte de fichiers que pour le téléchargement direct ; le reste (Workshop, montage, Lua)
    // n'arrive que par des messages d'état. Chaque étape pose un plancher et un plafond : la jauge avance
    // d'elle-même vers le plafond (jamais figée), sans le dépasser avant l'étape suivante.
    var elPct = $('pct'), elPhase = $('phase'), elDetail = $('detail'), elPlein = $('plein'), elPointe = $('pointe'), elEtoile = $('etoile');
    var S = { floor: 0.02, cap: 0.08, total: 0, needed: 0, creep: 0.02, shown: 0 };
    function etape(floor, cap) {
      if (floor > S.floor) S.floor = floor;
      if (cap > S.cap) S.cap = cap;
    }
    function texte(e, t) { if (e.textContent !== t) e.textContent = t; }

    var ETATS = [
      [/retriev|parsing|server info/i, 'Connexion', 0.04, 0.12],
      [/workshop|downloading|t[ée]l[ée]charg/i, 'Téléchargement', 0.12, 0.6],
      [/mount|montage/i, 'Montage des addons', 0.62, 0.7],
      [/sending client info/i, 'Envoi des infos', 0.72, 0.8],
      [/client info sent/i, 'Infos envoyées', 0.8, 0.86],
      [/lua files|received all/i, 'Fichiers Lua reçus', 0.86, 0.92],
      [/starting lua|lua started/i, 'Démarrage du Lua', 0.92, 0.98]
    ];

    window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
      if (servername) texte($('nom'), servername);
      var bits = [];
      if (mapname) bits.push(mapname);
      if (gamemode) bits.push(gamemode);
      if (maxplayers) bits.push(maxplayers + ' places');
      if (bits.length) texte($('carte'), bits.join('  ·  '));
      etape(0.04, 0.12);
    };
    window.SetFilesTotal = function (n) { S.total = Math.max(0, +n || 0); };
    window.SetFilesNeeded = function (n) { S.needed = Math.max(0, +n || 0); };
    window.DownloadingFile = function (f) {
      texte(elPhase, 'Téléchargement');
      texte(elDetail, String(f || '').replace(/^.*[\\\/]/, '') + (S.total ? '   ' + (S.total - S.needed) + ' / ' + S.total : ''));
      etape(0.12, 0.6);
    };
    window.SetStatusChanged = function (s) {
      s = String(s || '');
      for (var i = 0; i < ETATS.length; i++) {
        var e = ETATS[i];
        if (e[0].test(s)) {
          texte(elPhase, e[1]);
          etape(e[2], e[3]);
          // « Downloading 3/40 » (Workshop) : la part de l'étape qui est faite
          var m = s.match(/(\d+)\s*\/\s*(\d+)/);
          if (e[1] === 'Téléchargement' && m && +m[2] > 0) {
            var f = Math.min(1, +m[1] / +m[2]);
            etape(0.12 + 0.48 * f, Math.min(0.6, 0.12 + 0.48 * (f + 1 / +m[2])));
          }
          break;
        }
      }
      texte(elDetail, s);
    };

    // ------------------------------------------------------------------ la boucle
    var last = Date.now(), t0 = last, rot = 0;
    var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    function tick() {
      var now = Date.now(), dt = Math.min(0.1, (now - last) / 1000);
      last = now;

      var files = 0;
      if (S.total > 0) files = 0.12 + 0.48 * Math.min(1, (S.total - S.needed) / S.total);
      var target = Math.max(S.floor, files);
      S.creep = Math.max(S.creep, target);
      S.creep += (S.cap - S.creep) * Math.min(1, dt * 0.18);
      var goal = Math.min(1, Math.max(target, S.creep));
      var avant = S.shown;
      S.shown += (goal - S.shown) * Math.min(1, dt * 5);
      if (goal - S.shown < 0.0005) S.shown = goal;

      var p = S.shown * 100;
      elPlein.style.width = p.toFixed(2) + '%';
      elPointe.style.left = p.toFixed(2) + '%';
      var n = Math.floor(p);
      if (elPct.firstChild.nodeValue !== String(n)) elPct.firstChild.nodeValue = String(n);
      for (var k = 0; k < CRANS.length; k++) {
        var on = p >= (k + 1) * 10;
        if (CRANS[k].classList.contains('on') !== on) CRANS[k].classList.toggle('on', on);
      }
      // l'étoile du bout tourne quand la jauge avance, au pas de sa vitesse
      var vitesse = (S.shown - avant) / Math.max(dt, 0.001);
      if (!calme) rot += dt * (12 + Math.min(260, vitesse * 2600));
      elEtoile.setAttribute('transform', 'rotate(' + (rot % 360).toFixed(1) + ')');

      poussiere(dt, (now - t0) / 1000);
      raf(tick);
    }
    tick();

    // ------------------------------------------------------------------ démo hors jeu : index2.html?demo
    if (/[?&]demo/.test(location.search)) {
      var d0 = Date.now(), total = 180;
      GameDetails('Kyzen — Chainsaw Man RP', '', 'rp_tokyo_night', 64, '', 'mangarp');
      SetStatusChanged('Retrieving server info...');
      var demo = setInterval(function () {
        var s = (Date.now() - d0) / 1000;
        if (s > 1.5 && s < 9) {
          SetFilesTotal(total);
          var left = Math.max(0, Math.round(total * (1 - (s - 1.5) / 7.5)));
          SetFilesNeeded(left);
          DownloadingFile('materials/kyzen/ui/fond_v' + (left % 7 + 1) + '.png');
        } else if (s >= 9 && s < 11) SetStatusChanged('Mounting Addons');
        else if (s >= 11 && s < 12.5) SetStatusChanged('Sending client info...');
        else if (s >= 12.5 && s < 14) SetStatusChanged('Received all Lua files');
        else if (s >= 14 && s < 16) SetStatusChanged('Starting Lua...');
        else if (s >= 22) { clearInterval(demo); }
      }, 250);
    }
  })();
  </script>
</body>
</html>
