<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyzen</title>
<style>
  /* KYZEN — l'écran de chargement « BRUME » (2 nov.), AU PIXEL PRÈS de la maquette Figma « Kyzen — Vagabond »,
     page 06 : la brume claire et les personnages (une image composée, assets/kyzen_brume.jpg, par
     KYZEN-DATA/tools/fond_chargement.py), KYZEN en Cinzel sur un trait de sang, チェンソーマン, l'astuce (une par
     connexion), la barre fine rouge et l'étape en cours.
     La scène fait 1920 × 1080 et suit l'écran (le fond le couvre, le texte y tient). ⚠️ RIEN ne s'anime (GMod
     peine) : seule la barre avance. */
  @font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Alegreya Sans"; src: url("assets/fonts/AlegreyaSans-Medium.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: "Alegreya Sans"; src: url("assets/fonts/AlegreyaSans-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Yuji Syuku"; src: url("assets/fonts/YujiSyuku-kana.ttf") format("truetype"); font-weight: 400; }

  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d9d9dc; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
           -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  #fond { display: block; width: 1920px; height: 1080px; }
  .ligne { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; color: #3a3a40; }

  #trait { position: absolute; left: 640px; top: 789px; width: 640px; height: 72px; }
  #titre { top: 752px; height: 140px; line-height: 140px; font-family: "Cinzel", serif; font-weight: 700; font-size: 104px;
           letter-spacing: 14.56px; text-indent: 14.56px; color: #f7f6f2; text-shadow: 0 3px 8px rgba(0, 0, 0, 0.5); }
  #kana { top: 890px; height: 32px; line-height: 32px; font-family: "Yuji Syuku", serif; font-size: 22px;
          letter-spacing: 8.8px; text-indent: 8.8px; }
  #astuce { top: 940px; height: 22px; line-height: 22px; font-family: "Alegreya Sans", sans-serif; font-weight: 700;
            font-size: 18px; letter-spacing: 0.4px; }
  #astuce b { color: #9e0f1b; font-weight: 700; }
  #rail { position: absolute; left: 700px; top: 1000px; width: 520px; height: 2px; background: rgba(58, 58, 64, 0.25); }
  #plein { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: #9e0f1b; }
  #etat { top: 1014px; height: 18px; line-height: 18px; font-family: "Alegreya Sans", sans-serif; font-weight: 500; font-size: 15px; }
</style>
</head>
<body>
  <div class="scene" id="sceneFond"><img id="fond" src="assets/kyzen_brume.jpg" alt=""></div>
  <div class="scene" id="scene">
    <img id="trait" src="assets/trait_sang.png" alt="">
    <div class="ligne" id="titre">KYZEN</div>
    <div class="ligne" id="kana">チェンソーマン</div>
    <div class="ligne" id="astuce"></div>
    <div id="rail"><div id="plein"></div></div>
    <div class="ligne" id="etat">Connexion · 0 %</div>
  </div>

  <!-- la musique, en boucle -->
  <audio id="snd" loop autoplay preload="auto">
    <source src="assets/kyzen.mp3" type="audio/mpeg">
  </audio>

  <script>
  (function () {
    function $(id) { return document.getElementById(id); }

    // ------------------------------------------------------------------ la scène suit l'écran : le fond le couvre, le texte y tient
    function cadrer() {
      var w = window.innerWidth, h = window.innerHeight;
      var couvre = Math.max(w / 1920, h / 1080), tient = Math.min(w / 1920, h / 1080);
      var f = $('sceneFond'), s = $('scene');
      f.style.webkitTransform = f.style.transform = 'scale(' + couvre + ')';
      f.style.left = ((w - 1920 * couvre) / 2) + 'px'; f.style.top = ((h - 1080 * couvre) / 2) + 'px';
      s.style.webkitTransform = s.style.transform = 'scale(' + tient + ')';
      s.style.left = ((w - 1920 * tient) / 2) + 'px'; s.style.top = ((h - 1080 * tient) / 2) + 'px';
    }
    window.addEventListener('resize', cadrer);
    cadrer();

    // ------------------------------------------------------------------ la musique (3 %, ré-essais ; un clic ou une touche la lance)
    var VOL = 0.03;
    var a = $('snd');
    function go() {
      if (!a) return;
      a.volume = VOL;
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    }
    go();
    if (a) { a.addEventListener('canplay', go); a.addEventListener('loadeddata', go); }
    window.addEventListener('load', go);
    var tries = 0;
    var iv = setInterval(function () {
      go();
      if (++tries > 25 || (a && !a.paused && a.currentTime > 0)) clearInterval(iv);
    }, 400);
    ['click', 'keydown', 'mousemove'].forEach(function (e) { document.addEventListener(e, go); });

    // ------------------------------------------------------------------ l'astuce : une par connexion, jamais deux fois de suite la même
    var ASTUCES = [
      'Maintiens <b>C</b> : le menu des pouvoirs, l\'arbre des compétences et l\'inventaire.',
      'La touche <b>I</b> ouvre ton inventaire : c\'est là que tu équipes ton arme.',
      'Chaque grade te donne des <b>points de capacité</b> à dépenser dans l\'arbre des compétences.',
      '<b>Échap</b> ouvre le hub : la boutique, les paramètres et tes personnages.',
      'Les <b>démons</b> se battent à mains nues ; les <b>chasseurs</b> peuvent manier l\'épée.',
      '<b>TAB</b> affiche les joueurs connectés : clique sur un nom pour couper son micro.',
      'Tes objets sont <b>imperdables</b> : ni la mort ni la déconnexion ne te les retirent.',
      'La <b>molette</b>, ton arme de combat en main : changer d\'arme.'
    ];
    var avant = -1;
    try { avant = parseInt(localStorage.getItem('kyzen_ls_astuce'), 10); } catch (e) {}
    var ia = Math.floor(Math.random() * ASTUCES.length);
    if (ia === avant) ia = (ia + 1 + Math.floor(Math.random() * (ASTUCES.length - 1))) % ASTUCES.length;
    try { localStorage.setItem('kyzen_ls_astuce', String(ia)); } catch (e) {}
    $('astuce').innerHTML = ASTUCES[ia];

    // ------------------------------------------------------------------ l'avancement (API de chargement GMod)
    // GMod ne donne un compte de fichiers que pour le téléchargement direct ; le reste (Workshop, montage, Lua)
    // n'arrive que par des messages d'état. Chaque étape pose un plancher et un plafond : la barre avance
    // d'elle-même vers le plafond (jamais figée), sans le dépasser avant l'étape suivante.
    var elEtat = $('etat'), elPlein = $('plein');
    var S = { floor: 0.02, cap: 0.08, total: 0, needed: 0, creep: 0.02, shown: 0, phase: 'Connexion' };
    function etape(floor, cap) {
      if (floor > S.floor) S.floor = floor;
      if (cap > S.cap) S.cap = cap;
    }

    var ETATS = [
      [/retriev|parsing|server info/i, 'Connexion', 0.04, 0.12],
      [/workshop|downloading|t[ée]l[ée]charg/i, 'Téléchargement', 0.12, 0.6],
      [/mount|montage/i, 'Montage des addons', 0.62, 0.7],
      [/sending client info/i, 'Envoi des infos', 0.72, 0.8],
      [/client info sent/i, 'Infos envoyées', 0.8, 0.86],
      [/lua files|received all/i, 'Fichiers Lua reçus', 0.86, 0.92],
      [/starting lua|lua started/i, 'Démarrage du Lua', 0.92, 0.98]
    ];

    window.GameDetails = function () { etape(0.04, 0.12); };
    window.SetFilesTotal = function (n) { S.total = Math.max(0, +n || 0); };
    window.SetFilesNeeded = function (n) { S.needed = Math.max(0, +n || 0); };
    window.DownloadingFile = function () { S.phase = 'Téléchargement'; etape(0.12, 0.6); };
    window.SetStatusChanged = function (s) {
      s = String(s || '');
      for (var i = 0; i < ETATS.length; i++) {
        var e = ETATS[i];
        if (e[0].test(s)) {
          S.phase = e[1];
          etape(e[2], e[3]);
          // « Downloading 3/40 » (Workshop) : la part de l'étape qui est faite
          var m = s.match(/(\d+)\s*\/\s*(\d+)/);
          if (e[1] === 'Téléchargement' && m && +m[2] > 0) {
            var f = Math.min(1, +m[1] / +m[2]);
            etape(0.12 + 0.48 * f, Math.min(0.6, 0.12 + 0.48 * (f + 1 / +m[2])));
          }
          break;
        }
      }
    };

    // ------------------------------------------------------------------ la boucle : seule la barre avance (30 i/s)
    var last = Date.now();
    function tick() {
      var now = Date.now(), dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      var files = 0;
      if (S.total > 0) files = 0.12 + 0.48 * Math.min(1, (S.total - S.needed) / S.total);
      var target = Math.max(S.floor, files);
      S.creep = Math.max(S.creep, target);
      S.creep += (S.cap - S.creep) * Math.min(1, dt * 0.18);
      var goal = Math.min(1, Math.max(target, S.creep));
      S.shown += (goal - S.shown) * Math.min(1, dt * 5);
      if (goal - S.shown < 0.0005) S.shown = goal;
      elPlein.style.width = (S.shown * 520).toFixed(1) + 'px';
      var t = S.phase + ' · ' + Math.floor(S.shown * 100) + ' %';
      if (elEtat.textContent !== t) elEtat.textContent = t;
      setTimeout(tick, 33);
    }
    tick();

    // ------------------------------------------------------------------ démo hors jeu : index2.html?demo
    if (/[?&]demo/.test(location.search)) {
      var d0 = Date.now(), total = 213;
      GameDetails('Kyzen — Chainsaw Man RP', '', 'rp_tokyo_night', 64, '', 'mangarp');
      SetStatusChanged('Retrieving server info...');
      var demo = setInterval(function () {
        var s = (Date.now() - d0) / 1000;
        if (s > 1.5 && s < 9) {
          SetFilesTotal(total);
          SetFilesNeeded(Math.max(0, Math.round(total * (1 - (s - 1.5) / 7.5))));
          DownloadingFile('materials/kyzen2/perso_aki.png');
        } else if (s >= 9 && s < 11) { SetFilesTotal(0); SetStatusChanged('Mounting Addons'); }
        else if (s >= 11 && s < 12.5) SetStatusChanged('Sending client info...');
        else if (s >= 12.5 && s < 14) SetStatusChanged('Received all Lua files');
        else if (s >= 14 && s < 16) SetStatusChanged('Starting Lua...');
        else if (s >= 22) { clearInterval(demo); }
      }, 250);
    }
  })();
  </script>
</body>
</html>
